name: Catan tests
on:
  push:
    paths: ['.devcontainer/**', 'Catan-AI/**', '.github/workflows/catan-tests.yml']
  pull_request:
    paths: ['.devcontainer/**', 'Catan-AI/**', '.github/workflows/catan-tests.yml']
jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -r Catan-AI/requirements-dev.txt
      - run: python -m pytest Catan-AI/tests -q
      - name: Validate container configuration
        run: |
          python -m json.tool .devcontainer/devcontainer.json > /dev/null
          python -m json.tool .devcontainer/devcontainer-lock.json > /dev/null
          bash -n .devcontainer/setup.sh Catan-AI/scripts/play-container.sh
